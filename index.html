<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUINOX // TERMINAL</title>

    <!-- VT323 terminal aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --term-bg: #000000;
            --term-text: #c8c8c8;
            --glitch-red: #ff003c;
            --glitch-blue: #00f0ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--term-bg);
            color: var(--term-text);
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-font-smoothing: none;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Subtle screen flicker */
        .flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.01);
            z-index: 9998;
        }

        @keyframes flicker {
            0% { opacity: 0.9; }
            50% { opacity: 1; }
            100% { opacity: 0.9; }
        }

        .terminal-container {
            width: 100%;
            max-width: 600px;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* Boot Sequence Text */
        .boot-text {
            font-size: 1.2rem;
            line-height: 1.5;
            text-shadow: 0 0 2px rgba(200, 200, 200, 0.5);
            min-height: 3.6rem;
            margin-bottom: 1.5rem;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: var(--term-text);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Video Feed */
        .feed-wrapper {
            opacity: 0;
            transition: opacity 1.5s ease-in;
            margin-bottom: 1.5rem;
        }

        .feed-header {
            font-size: 1.1rem;
            opacity: 0.7;
            margin-bottom: 0.5rem;
            display: block;
        }

        .video-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 1px solid #333;
            background: #000;
        }

        .video-frame iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        .audio-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            cursor: pointer;
            z-index: 2;
            transition: opacity 0.3s;
        }

        .audio-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .audio-overlay span {
            font-size: 1.6rem;
            letter-spacing: 0.15rem;
            border: 1px solid #666;
            padding: 0.6rem 1.4rem;
            background: rgba(0, 0, 0, 0.8);
            text-shadow: 2px 0 var(--glitch-red), -2px 0 var(--glitch-blue);
        }

        /* Nodes (Links) */
        .nodes-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            flex-grow: 1;
        }

        .node {
            display: block;
            text-decoration: none;
            color: inherit;
            border: 1px solid #333;
            padding: 1rem 1.2rem;
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            transition: border-color 0.2s;
        }

        .node-header {
            font-size: 1.1rem;
            opacity: 0.7;
            margin-bottom: 0.3rem;
            display: block;
        }

        .node-action {
            font-size: 1.4rem;
            display: block;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .node:hover {
            border-color: #666;
            background: rgba(255, 255, 255, 0.05);
            animation: glitch-anim 0.3s infinite;
        }

        .node:hover .node-action {
            text-shadow: 2px 0 var(--glitch-red), -2px 0 var(--glitch-blue);
        }

        @keyframes glitch-anim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px) }
            40% { transform: translate(-1px, -1px) }
            60% { transform: translate(2px, 1px) }
            80% { transform: translate(1px, -1px) }
            100% { transform: translate(0) }
        }

        /* Footer */
        .terminal-footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0;
            color: #555;
            transition: opacity 2s ease-in;
        }

        .terminal-footer p {
            margin: 0.2rem 0;
        }
    </style>
</head>
<body>

    <!-- Visual Overlays -->
    <div class="scanlines"></div>
    <div class="flicker"></div>

    <main class="terminal-container">

        <!-- Boot Sequence Anchor -->
        <div class="boot-text" id="boot-text-container">
            <span id="typed-output"></span><span class="cursor" id="cursor"></span>
        </div>

        <!-- Primary Video Feed: Villain (autoplay, muted until user enables audio) -->
        <div class="feed-wrapper" id="feed-wrapper">
            <span class="feed-header">[ PRIMARY_FEED : NOW_PLAYING ]</span>
            <div class="video-frame">
                <iframe id="villain-player"
                    src="https://www.youtube.com/embed/s_IJLfiArlg?autoplay=1&mute=1&loop=1&playlist=s_IJLfiArlg&rel=0"
                    title="equinox - Villain (Official Music Video)"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
                <div class="audio-overlay" id="audio-overlay">
                    <span>&gt; ENABLE_AUDIO</span>
                </div>
            </div>
            <span class="feed-header" style="margin-top: 0.5rem;">&gt; "Villain" // OFFICIAL_MUSIC_VIDEO // ON_LOOP</span>
        </div>

        <!-- Links Container -->
        <div class="nodes-wrapper" id="nodes-wrapper">

            <!-- NODE 01: TIKTOK -->
            <a href="https://www.tiktok.com/@atmequinox" class="node" target="_blank" rel="noopener noreferrer">
                <span class="node-header">[ NODE 01 : SURVEILLANCE_LOGS ]</span>
                <span class="node-action">&gt; TIKTOK_FEED</span>
            </a>

            <!-- NODE 02: INSTAGRAM -->
            <a href="https://www.instagram.com/atmequinox/" class="node" target="_blank" rel="noopener noreferrer">
                <span class="node-header">[ NODE 02 : VISUAL_ARCHIVE ]</span>
                <span class="node-action">&gt; INSTAGRAM_GRID</span>
            </a>

            <!-- NODE 03: KICK -->
            <a href="https://kick.com/atmequinox" class="node" target="_blank" rel="noopener noreferrer">
                <span class="node-header">[ NODE 03 : LIVE_UPLINK ]</span>
                <span class="node-action">&gt; KICK_STREAM</span>
            </a>

            

        </div>

        <!-- Footer -->
        <footer class="terminal-footer" id="terminal-footer">
            <p>// no outward signal detected. you are being watched.</p>
            <p>SYS_OP: EQUINOX</p>
        </footer>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const outputElement = document.getElementById('typed-output');
            const nodesWrapper = document.getElementById('nodes-wrapper');
            const feedWrapper = document.getElementById('feed-wrapper');
            const footer = document.getElementById('terminal-footer');
            const cursor = document.getElementById('cursor');

            const sequence = [
                "[ INITIALIZING_SYSTEM ]...",
                "<br>STATUS: ONLINE // LOADING_PRIMARY_FEED"
            ];

            let charIndex = 0;
            let stringIndex = 0;
            let isTag = false;

            function typeWriter() {
                if (stringIndex < sequence.length) {
                    const currentString = sequence[stringIndex];

                    if (currentString.charAt(charIndex) === '<') {
                        isTag = true;
                    }

                    if (isTag) {
                        outputElement.innerHTML += currentString.charAt(charIndex);
                        if (currentString.charAt(charIndex) === '>') {
                            isTag = false;
                        }
                        charIndex++;
                        typeWriter();
                        return;
                    }

                    outputElement.innerHTML += currentString.charAt(charIndex);
                    charIndex++;

                    if (charIndex < currentString.length) {
                        const typeSpeed = Math.random() * 50 + 30;
                        setTimeout(typeWriter, typeSpeed);
                    } else {
                        stringIndex++;
                        charIndex = 0;
                        setTimeout(typeWriter, 400);
                    }
                } else {
                    setTimeout(revealSystem, 500);
                }
            }

            function revealSystem() {
                feedWrapper.style.opacity = '1';
                nodesWrapper.style.opacity = '1';
                footer.style.opacity = '1';
                cursor.style.opacity = '0.5';
            }

            // Browsers block autoplay WITH sound — the video starts muted.
            // Clicking the overlay reloads the player with audio enabled (a user
            // gesture, so the browser allows it).
            const overlay = document.getElementById('audio-overlay');
            const player = document.getElementById('villain-player');
            overlay.addEventListener('click', () => {
                player.src = "https://www.youtube.com/embed/s_IJLfiArlg?autoplay=1&mute=0&loop=1&playlist=s_IJLfiArlg&rel=0";
                overlay.classList.add('hidden');
            });

            setTimeout(typeWriter, 600);
        });
    </script>
</body>
</html>
